// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        tools_build_gradle_version = '8.2.2'
        kotlin_version = '1.9.22'

        appcompat_version = '1.7.0'
        core_ktx_version = '1.12.0'
        core_testing_version = '2.2.0'
        constraintlayout_version = '2.2.0'
        material_version = "1.12.0"
        moshi_version = '1.8.0'
        retrofit_version = '2.9.0'
        okhttp_version = '4.12.0'

        junit_version = '4.12'
        mockito_version = '5.5.0'
        mockito_kotlin_version = '2.2.0'

        test_runner_version = '1.5.2'
        espresso_version = '3.6.1'

        koin_version = "3.5.6"
        lifecycle_version = "2.8.7"
        coroutines_version = "1.3.3"
        coroutines_android_version = "1.8.0"
        core_ktx_test_version = "1.6.1"

        moshi_version = "1.11.0"
        timber_version = "5.0.1"
        glide_version = "5.0.0-rc01"
        room_version = "2.6.1"
        swiperefreshlayout_version = "1.1.0"
        test_rules_version = "1.6.1"
        test_runner_version = "1.6.2"
        mockk_version = "1.13.16"
        mockk_android_version = "1.12.3"
        uiautomator_version = "2.3.0"
        androidx_junit_version = "1.2.1"
    }

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$tools_build_gradle_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}


allprojects {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

tasks.register('cleanBuildDir', Delete) {
    delete rootProject.buildDir
}

